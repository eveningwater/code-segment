<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string-permutations - 全排列实验室</title>
    <link rel="stylesheet" href="../../demo/plugins/modal/style.css">
    <link rel="stylesheet" href="../../demo/plugins/checkbox/style.css">
    <link rel="stylesheet" href="../../demo/plugins/notification/style.css">
    <link rel="stylesheet" href="../../demo/plugins/select/style.css">
    <link rel="stylesheet" href="../../demo/plugins/input-number/style.css">
    <link rel="stylesheet" href="../../demo/plugins/datetime-picker/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #134e4a 0%, #115e59 35%, #0f766e 100%);
            color: #0f172a;
            padding: 22px;
        }

        .app {
            max-width: 1280px;
            margin: 0 auto;
        }

        .hero {
            color: #ecfdf5;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 1.95rem;
            margin-bottom: 10px;
        }

        .hero p {
            opacity: 0.93;
            line-height: 1.75;
            max-width: 880px;
        }

        .hero code {
            background: rgba(15, 23, 42, 0.35);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 18px;
            align-items: start;
        }

        .card {
            background: rgba(248, 250, 252, 0.97);
            border-radius: 16px;
            border: 1px solid rgba(153, 246, 228, 0.4);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.22);
            padding: 16px;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 1.05rem;
            color: #134e4a;
            margin-bottom: 12px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        .input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.22);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #f8fafc;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.22);
        }

        .btn.primary {
            background: linear-gradient(135deg, #0d9488, #0f766e);
        }

        .btn.success {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .btn.warn {
            background: linear-gradient(135deg, #ea580c, #c2410c);
        }

        .btn.dark {
            background: linear-gradient(135deg, #334155, #1e293b);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat {
            background: #fff;
            border: 1px solid #ccfbf1;
            border-radius: 12px;
            padding: 11px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 1.05rem;
            color: #0f766e;
            word-break: break-all;
        }

        .stat span {
            font-size: 0.72rem;
            color: #64748b;
        }

        .pill-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 220px;
            overflow: auto;
            padding: 10px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
        }

        .pill {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .table-wrap {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: auto;
            max-height: 360px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            font-size: 0.82rem;
        }

        th,
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        th {
            position: sticky;
            top: 0;
            background: #ecfdf5;
            color: #115e59;
            z-index: 1;
        }

        .muted {
            color: #64748b;
            font-size: 0.82rem;
        }

        .report-date-row > div {
            min-width: 0;
            position: relative;
            overflow: visible;
        }

        .report-date-row .ew-datetime-picker {
            width: 100%;
            min-width: 0;
        }

        .report-date-row .datetime-input {
            min-width: 0;
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
        }

        .report-date-row .datetime-icon {
            padding: 10px 12px;
        }

        .report-date-row .datetime-panel {
            left: 0;
            right: auto;
            width: max(100%, 320px);
            z-index: 5000;
        }

        .report-date-row .ew-datetime-picker.open {
            z-index: 5000;
        }

        @media (max-width: 1080px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="hero">
            <h1>stringPermutations 全排列实验室</h1>
            <p>
                使用递归版 <code>stringPermutations</code> 生成字符串的全排列（含重复字符时结果含<strong>重复项</strong>）。
                本页提供长度上限、列表截断、去重统计与导出，避免误输入过长字符串导致页面卡死。
            </p>
        </header>

        <div class="layout">
            <aside>
                <section class="card">
                    <h2>1) 输入与预设</h2>
                    <div class="field">
                        <label>快速预设</label>
                        <div id="presetSelect"></div>
                    </div>
                    <div class="field">
                        <label for="strInput">待排列字符串</label>
                        <input id="strInput" class="input" type="text" maxlength="12" autocomplete="off" />
                    </div>
                    <div class="grid-2">
                        <div class="field">
                            <label>允许最大长度 n</label>
                            <div id="maxLenInput"></div>
                        </div>
                        <div class="field">
                            <label>表格最多展示行</label>
                            <div id="maxRowsInput"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>导出报告时间（可选）</label>
                        <div class="report-date-row">
                            <div id="reportDatePicker"></div>
                        </div>
                    </div>
                    <div id="optionChecks"></div>
                    <div class="btn-row">
                        <button class="btn primary" id="runBtn">生成排列</button>
                        <button class="btn success" id="exportBtn">导出 CSV</button>
                        <button class="btn warn" id="demoBtn">示例 abc</button>
                        <button class="btn dark" id="clearBtn">清空</button>
                    </div>
                    <p class="muted" style="margin-top:10px;">文档提示：n 过大时组合数爆炸，默认 n≤8；n≥7 时可开启二次确认。</p>
                </section>
            </aside>

            <main>
                <section class="card">
                    <h2>统计</h2>
                    <div class="stats">
                        <div class="stat"><strong id="statN">0</strong><span>字符数 n</span></div>
                        <div class="stat"><strong id="statFact">—</strong><span>n!（参考）</span></div>
                        <div class="stat"><strong id="statTotal">0</strong><span>生成条数</span></div>
                        <div class="stat"><strong id="statUnique">0</strong><span>去重后种数</span></div>
                        <div class="stat"><strong id="statShown">0</strong><span>表格展示行</span></div>
                    </div>
                </section>

                <section class="card">
                    <h2>前若干条预览（胶囊）</h2>
                    <div class="pill-wrap" id="pillWrap">
                        <span class="muted">生成后显示前 40 条</span>
                    </div>
                    <h2>表格（截断展示）</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>排列</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="2" class="muted">点击「生成排列」。</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../../demo/plugins/modal/index.js"></script>
    <script src="../../demo/plugins/checkbox/index.js"></script>
    <script src="../../demo/plugins/notification/index.js"></script>
    <script src="../../demo/plugins/select/index.js"></script>
    <script src="../../demo/plugins/input-number/index.js"></script>
    <script src="../../demo/plugins/datetime-picker/index.js"></script>

    <script>
        const stringPermutations = str => {
            if (str.length <= 2) {
                return str.length === 2 ? [str, str[1] + str[0]] : str;
            }
            return str
                .split('')
                .reduce(
                    (acc, letter, i) =>
                        acc.concat(
                            stringPermutations(str.slice(0, i) + str.slice(i + 1)).map(
                                val => letter + val
                            )
                        ),
                    []
                );
        };

        class PermutationLab {
            constructor() {
                this.plugins = {};
                this.lastList = [];
                this.optionOrder = ["sortLex", "confirmHeavy", "dedupePreview"];
                this.init();
            }

            init() {
                this.mountPlugins();
                this.bindEvents();
                this.plugins.presetSelect?.setValue?.("abc");
                this.applyPreset("abc");
                this.run(true);
                this.toast("全排列实验室已就绪", "success");
            }

            mountPlugins() {
                try {
                    this.plugins.modal = new Modal();
                    this.plugins.notification = new Notification();
                } catch (e) {
                    console.warn(e);
                }

                try {
                    const el = document.getElementById("presetSelect");
                    if (el) {
                        this.plugins.presetSelect = new Select({
                            options: [
                                { value: "abc", label: "abc（6 种）" },
                                { value: "aab", label: "aab（含重复）" },
                                { value: "1234", label: "1234（24 种）" },
                                { value: "custom", label: "仅使用输入框" }
                            ],
                            placeholder: "预设",
                            onChange: (v) => this.applyPreset(v)
                        });
                        this.plugins.presetSelect.mount(el);
                    }
                } catch (e) {
                    console.warn("Select", e);
                }

                try {
                    const a = document.getElementById("maxLenInput");
                    if (a) {
                        this.plugins.maxLen = new InputNumber({
                            min: 1,
                            max: 10,
                            step: 1,
                            value: 8
                        });
                        this.plugins.maxLen.mount(a);
                    }
                    const b = document.getElementById("maxRowsInput");
                    if (b) {
                        this.plugins.maxRows = new InputNumber({
                            min: 20,
                            max: 2000,
                            step: 20,
                            value: 200
                        });
                        this.plugins.maxRows.mount(b);
                    }
                } catch (e) {
                    console.warn("InputNumber", e);
                }

                try {
                    const rd = document.getElementById("reportDatePicker");
                    if (rd) {
                        this.plugins.reportDate = new DateTimePicker({ placeholder: "报告时间（可选）" });
                        this.plugins.reportDate.mount(rd);
                    }
                } catch (e) {
                    console.warn("DateTimePicker", e);
                }

                const opt = document.getElementById("optionChecks");
                if (opt) {
                    try {
                        this.plugins.options = Checkbox.createCheckboxGroup({
                            items: [
                                { id: "sortLex", label: "表格按字典序排序展示", checked: true },
                                { id: "confirmHeavy", label: "n≥7 时生成前二次确认", checked: true },
                                { id: "dedupePreview", label: "胶囊预览仅显示去重项", checked: false }
                            ]
                        });
                        opt.appendChild(this.plugins.options.container);
                    } catch (e) {
                        console.warn("Checkbox", e);
                    }
                }
            }

            getOptions() {
                const fb = [true, true, false];
                const st = this.plugins.options?.getAllChecked?.() || fb;
                const o = {};
                this.optionOrder.forEach((k, i) => { o[k] = !!st[i]; });
                return o;
            }

            bindEvents() {
                document.getElementById("runBtn")?.addEventListener("click", () => this.run());
                document.getElementById("exportBtn")?.addEventListener("click", () => this.exportCsv());
                document.getElementById("demoBtn")?.addEventListener("click", () => {
                    this.plugins.presetSelect?.setValue?.("abc");
                    this.applyPreset("abc");
                    this.run();
                });
                document.getElementById("clearBtn")?.addEventListener("click", () => this.clear());
            }

            applyPreset(v) {
                const input = document.getElementById("strInput");
                if (!input || v === "custom") return;
                const map = { abc: "abc", aab: "aab", "1234": "1234" };
                if (map[v]) input.value = map[v];
                this.toast("已套用预设", "info");
            }

            factorial(n) {
                if (n <= 1) return 1;
                let x = 1;
                for (let i = 2; i <= n; i++) x *= i;
                return x;
            }

            normalizeResult(raw) {
                if (Array.isArray(raw)) return raw;
                if (typeof raw === "string") return raw.length ? [raw] : [];
                return [];
            }

            async run(silent) {
                const opts = this.getOptions();
                let s = (document.getElementById("strInput")?.value || "").trim();
                const maxLen = this.plugins.maxLen?.getValue?.() || 8;

                if (!s.length) {
                    this.toast("请输入非空字符串", "warning");
                    return;
                }

                if (s.length > maxLen) {
                    this.toast(`长度超过允许上限 ${maxLen}，已截断`, "warning");
                    s = s.slice(0, maxLen);
                    document.getElementById("strInput").value = s;
                }

                if (s.length >= 7 && opts.confirmHeavy && this.plugins.modal?.confirm) {
                    const ok = await this.plugins.modal.confirm(
                        `当前 n=${s.length}，理论规模约 ${this.factorial(s.length)} 种，可能耗时数秒，是否继续？`
                    );
                    if (!ok) return;
                }

                let list;
                try {
                    list = this.normalizeResult(stringPermutations(s));
                } catch (e) {
                    this.toast("计算异常：" + (e.message || e), "warning");
                    return;
                }

                this.lastList = list;
                const unique = Array.from(new Set(list));
                const sortLex = opts.sortLex;
                const display = sortLex ? [...list].sort((a, b) => a.localeCompare(b)) : list;
                const maxRows = this.plugins.maxRows?.getValue?.() || 200;
                const rows = display.slice(0, maxRows);

                document.getElementById("statN").textContent = String(s.length);
                document.getElementById("statFact").textContent =
                    s.length <= 12 ? String(this.factorial(s.length)) : "过大";
                document.getElementById("statTotal").textContent = String(list.length);
                document.getElementById("statUnique").textContent = String(unique.length);
                document.getElementById("statShown").textContent = String(rows.length);

                document.getElementById("tableBody").innerHTML = rows
                    .map((p, i) => `<tr><td>${i + 1}</td><td>${this.escapeHtml(p)}</td></tr>`)
                    .join("");

                const previewSource = opts.dedupePreview ? unique.sort((a, b) => a.localeCompare(b)) : display;
                const pills = previewSource.slice(0, 40);
                document.getElementById("pillWrap").innerHTML = pills.length
                    ? pills.map((p) => `<span class="pill">${this.escapeHtml(p)}</span>`).join("")
                    : '<span class="muted">无结果</span>';

                if (!silent) {
                    this.toast(`已生成 ${list.length} 条（唯一 ${unique.length} 种）`, "success");
                }
            }

            async clear() {
                if (this.plugins.modal?.confirm) {
                    const ok = await this.plugins.modal.confirm("确定清空输入与结果？");
                    if (!ok) return;
                }
                document.getElementById("strInput").value = "";
                this.lastList = [];
                document.getElementById("tableBody").innerHTML =
                    '<tr><td colspan="2" class="muted">已清空。</td></tr>';
                document.getElementById("pillWrap").innerHTML = '<span class="muted">—</span>';
                ["statN", "statTotal", "statUnique", "statShown"].forEach((id) => {
                    document.getElementById(id).textContent = "0";
                });
                document.getElementById("statFact").textContent = "—";
                this.toast("已清空", "info");
            }

            exportCsv() {
                if (!this.lastList.length) {
                    this.toast("请先生成排列", "warning");
                    return;
                }
                const opts = this.getOptions();
                const order = opts.sortLex ? [...this.lastList].sort((a, b) => a.localeCompare(b)) : this.lastList;
                const reportTs = this.plugins.reportDate?.getValue?.() || "";
                const lines = [];
                if (reportTs) lines.push(`# report_at,${reportTs}`);
                lines.push("# string_permutations_count," + order.length);
                lines.push("index,permutation");
                order.forEach((p, i) => {
                    lines.push(`${i + 1},"${String(p).replace(/"/g, '""')}"`);
                });
                const csv = lines.join("\n");
                if (navigator.clipboard?.writeText) {
                    navigator.clipboard.writeText(csv).then(() => this.toast("CSV 已复制", "success")).catch(() => this.fallbackCopy(csv));
                } else this.fallbackCopy(csv);
            }

            fallbackCopy(text) {
                const t = document.createElement("textarea");
                t.value = text;
                document.body.appendChild(t);
                t.select();
                document.execCommand("copy");
                t.remove();
                this.toast("已复制（兼容模式）", "info");
            }

            toast(msg, type) {
                if (this.plugins.notification?.show) this.plugins.notification.show(msg, type);
                else console.log(type, msg);
            }

            escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            window.permutationLab = new PermutationLab();
        });
    </script>
</body>

</html>
